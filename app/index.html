    <script>
      (() => {
        // Day and night are the only two states. A device's system preference
        // seeds the very first visit; after that the stored choice wins.
        let preference = 'light';
        try {
          const saved = localStorage.getItem('bead-theme');
          if (saved === 'dark' || saved === 'light') preference = saved;
          else {
            preference = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            localStorage.setItem('bead-theme', preference);
          }
        } catch {
          preference = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        const dark = preference === 'dark';
        const root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = root.dataset.theme;
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue('--background').trim();
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = dark ? 'black-translucent' : 'default';
        const manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.href = './manifest-' + root.dataset.theme + '.webmanifest';
        document.head.appendChild(manifest);
      })();
    </script>
